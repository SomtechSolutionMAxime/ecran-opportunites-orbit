  else if (proba < 50) recommendations.push('Augmenter les chances de conversion avec des interactions ciblées');
  let d = 999;
  if (lastInteractionDate) d = daysBetween(NOW, new Date(lastInteractionDate));
  if (d <= 7) score += 30;
  else if (d <= 14) { score += 20; recommendations.push("Dernière interaction il y a plus d'une semaine : Planifier un suivi"); }
  else if (d <= 30) { score += 10; recommendations.push('Aucune interaction depuis 2+ semaines : Contact urgent recommandé'); }

  if (opportunity.date_cloture_estimee) {
    const dc = daysBetween(new Date(opportunity.date_cloture_estimee), NOW);
    if (dc < 0) recommendations.push('Date de clôture dépassée : Mettre à jour ou clôturer');
    else if (dc <= 7) { score += 20; recommendations.push('Clôture imminente : Actions finales à planifier'); }
    else if (dc <= 30) score += 15; else if (dc <= 90) score += 10; else score += 5;
  } else recommendations.push('Définir une date de clôture estimée');

  if (score >= 75) { level = 'excellent'; label = 'Excellente'; color = 'text-green-700'; bgColor = 'bg-green-100'; dotColor = 'bg-green-500'; }
  else if (score >= 50) { level = 'good'; label = 'Bonne'; color = 'text-blue-700'; bgColor = 'bg-blue-100'; dotColor = 'bg-blue-500'; }
  else if (score >= 30) { level = 'warning'; label = 'Attention'; color = 'text-orange-700'; bgColor = 'bg-orange-100'; dotColor = 'bg-orange-500'; }
  else { level = 'critical'; label = 'Critique'; color = 'text-red-700'; bgColor = 'bg-red-100'; dotColor = 'bg-red-500'; }
  return { score: Math.round(score), level, label, color, bgColor, dotColor, recommendations: recommendations.length ? recommendations : ['Opportunité en bonne santé, continuer le suivi'] };
