// Santé sur 100 : activité récente + probabilité + proximité de la clôture
function healthScore(o) {
  if (o.etape === 'gagnee') return 100;
  if (o.etape === 'perdue' || o.etape === 'archivee') return 0;
  const inact = daysSince(o.lastActivity);
  let s = 100;
  if (inact > 30) s -= 55; else if (inact > 14) s -= 30; else if (inact > 7) s -= 10;
  s -= Math.round((100 - o.probabilite) * 0.3);
  const du = daysUntil(o.cloture);
  if (du < 0) s -= 20; else if (du <= 7 && o.etape !== 'negociation') s -= 10;
  return Math.max(0, Math.min(100, s));
}

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const filtered = useMemo(() => opps.filter(o => {
    if (q && !(o.nom + ' ' + o.entreprise + ' ' + o.contact).toLowerCase().includes(q.toLowerCase())) return false;
    if (fStage && o.etape !== fStage) return false;
    if (fHealth && healthLevel(healthScore(o)) !== fHealth) return false;
    if (fSource && o.source !== fSource) return false;
    if (fOwner && o.owner !== fOwner) return false;
    if (view === 'liste' && !showClosed && isClosed(o) && !fStage) return false;

  }), [opps, q, fStage, fHealth, fSource, fOwner, view, showClosed]);

  // KPI

        h('div', { className: 'flex items-center gap-2' },
          h(Btn, { icon: Download, onClick: () => notify('Export CSV lancé (exemple)') }, 'Export CSV'),
          h(Btn, { variant: 'primary', icon: Plus, onClick: () => notify('Formulaire de création — à maquetter') }, 'Nouvelle opportunité'))),

      h('div', { className: 'p-6 space-y-5' },
        // KPI
        h('div', { className: 'grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3' },
          h(KpiCard, { icon: Target, label: 'Actives', value: active.length, sub: `${dormant.length} dormante${dormant.length > 1 ? 's' : ''}`, tone: 'indigo' }),
          h(KpiCard, { icon: DollarSign, label: 'Pipeline', value: fmtMoney(pipeline), sub: 'valeur brute', tone: 'sky' }),
          h(KpiCard, { icon: TrendingUp, label: 'Pondérée', value: fmtMoney(weighted), sub: 'valeur × probabilité', tone: 'violet' }),
          h(KpiCard, { icon: Check, label: 'Conversion', value: convRate + ' %', sub: `${won.length} gagnée${won.length > 1 ? 's' : ''} / ${lost.length} perdue${lost.length > 1 ? 's' : ''}`, tone: 'emerald' }),
          h(KpiCard, { icon: Clock, label: 'Cycle moyen', value: cycle + ' j', sub: 'création → gagnée', tone: 'amber' })),

        // Alerte dormantes
        dormant.length > 0 && showDormant && h('div', { className: 'rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 flex items-start gap-3' },
          h(AlertTriangle, { size: 18, className: 'text-amber-600 mt-0.5 shrink-0' }),
          h('div', { className: 'flex-1 text-sm' },
            h('span', { className: 'font-semibold text-amber-900' }, `${dormant.length} opportunité${dormant.length > 1 ? 's' : ''} sans activité depuis 14 jours ou plus. `),
            h('span', { className: 'text-amber-800' }, 'Sans relance, elles finissent par se perdre en silence.'),
            h('div', { className: 'mt-1.5 flex flex-wrap gap-1.5' }, ...dormant.map(o => h('button', { key: o.id, onClick: () => setSelectedId(o.id),
              className: `text-xs px-2 py-0.5 rounded-full border ${dormancy(o) === 'critique' ? 'bg-rose-100 border-rose-200 text-rose-800' : 'bg-white border-amber-200 text-amber-900'} hover:ring-2 hover:ring-amber-300` },
              `${o.entreprise} · ${daysSince(o.lastActivity)} j`)))),
          h('button', { onClick: () => setShowDormant(false), className: 'text-amber-700 hover:text-amber-900' }, h(X, { size: 16 }))),

        // Barre d'outils
        h('div', { className: 'flex items-center gap-2 flex-wrap' },
          h('div', { className: 'inline-flex rounded-md border border-slate-300 bg-white overflow-hidden' },
            ...[['pipeline', 'Pipeline', LayoutGrid], ['liste', 'Liste', ListIcon]].map(([v, label, Icon]) => h('button', { key: v, onClick: () => setView(v),
              className: `px-3 py-1.5 text-sm inline-flex items-center gap-1.5 ${view === v ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-50'}` }, h(Icon, { size: 15 }), label))),
          h('div', { className: 'relative' },
            h(Search, { size: 15, className: 'absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400' }),
            h('input', { value: q, onChange: e => setQ(e.target.value), placeholder: 'Rechercher une opportunité, une entreprise…', className: 'h-9 w-72 pl-8 pr-3 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500' })),
          h(Select, { value: fStage, onChange: setFStage, placeholder: 'Toutes les étapes', options: STAGES.map(s => ({ value: s.id, label: s.label })) }),
          h(Select, { value: fHealth, onChange: setFHealth, placeholder: 'Toute santé', options: Object.entries(HEALTH).map(([k, v]) => ({ value: k, label: v.label })) }),
          h(Select, { value: fSource, onChange: setFSource, placeholder: 'Toutes les sources', options: SOURCES.map(s => ({ value: s, label: s })) }),
          h(Select, { value: fOwner, onChange: setFOwner, placeholder: 'Tous les responsables', options: OWNERS.map(o => ({ value: o.id, label: o.name })) }),
          hasFilters && h(Btn, { variant: 'ghost', icon: X, onClick: resetFilters }, 'Effacer'),
          h('label', { className: 'ml-auto text-sm text-slate-600 inline-flex items-center gap-2 cursor-pointer select-none' },
            h('input', { type: 'checkbox', checked: showClosed, onChange: e => setShowClosed(e.target.checked), className: 'rounded border-slate-300' }), 'Afficher gagnées / perdues / archivées')),

        // Contenu
        view === 'pipeline'
          ? h(PipelineView, { opps: filtered, onOpen: setSelectedId, selectedId, showClosed: showClosed || !!fStage })
          : h(ListView, { opps: filtered, onOpen: setSelectedId, selectedId }),

        h('p', { className: 'text-xs text-slate-400' }, 'Maquette cliquable — les données sont fictives et les actions ne modifient que cet écran. Rechargez la page pour repartir de zéro.'))),

    selected && h(Detail, { o: selected, onClose: () => setSelectedId(null), onAdvance: advance, onWin: win, onLose: lose, onArchive: archive, onCreate: create, onEdit: () => notify('Formulaire d’édition — à maquetter') }),
    toast && h('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50 fadein' }, toast));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
